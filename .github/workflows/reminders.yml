name: Reminders

# Sends due reminders, the morning brief and the weekly review to Discord through a webhook.
# Enable by setting the repository variable REMINDER_RUNNER=actions and the secret DISCORD_WEBHOOK_URL.
# Set REMINDER_RUNNER=bot while the Discord bot is running so only one of them sends.
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the busy top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  tick:
    if: vars.REMINDER_RUNNER == 'actions' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml tzdata
      - name: Send due reminders
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m secretary tick --send webhook
      - name: Record what was sent
        run: |
          git config user.name "secretary-bot"
          git config user.email "secretary-bot@users.noreply.github.com"
          git add data/state/sent.json
          if ! git diff --cached --quiet; then
            git commit -m "secretary: reminder log [skip ci]"
            for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
          fi
