name: Safety net

# Claude writes every check-in and reminder itself. This workflow is only the safety net: every
# 30 minutes it sends CRITICAL reminders (appointments, immigration, health, or `critical: true`)
# that nobody marked as delivered within the grace period (data/settings.yaml -> delivery).
# Needs the repository secret DISCORD_WEBHOOK_URL. Set the variable SAFETY_NET=off to pause it.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  tick:
    if: vars.SAFETY_NET != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml tzdata
      - name: Send overdue critical reminders
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "No webhook configured yet; skipping."; exit 0; fi
          python -m secretary tick --send webhook --backup
      - name: Record what was sent
        run: |
          git config user.name "secretary-bot"
          git config user.email "secretary-bot@users.noreply.github.com"
          git add data/state/sent.json
          if ! git diff --cached --quiet; then
            git commit -m "secretary: safety-net log [skip ci]"
            for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
          fi
